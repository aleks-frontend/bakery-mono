<!DOCTYPE html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #362617;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      /* Sub-comp slots stretch to fill the root; z-index controls crossfade paint order
         (later scenes must paint OVER earlier ones during an overlap). */
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
      #slot-01 {
        z-index: 1;
      }
      #slot-02 {
        z-index: 2;
      }
      #slot-03 {
        z-index: 3;
      }
      #slot-04 {
        z-index: 4;
      }
      #slot-05 {
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-xv50" id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="17.8">
      <!-- Scene 1 — The question (0.0 - 3.0) -->
      <div data-hf-id="hf-lqct" id="slot-01" data-composition-id="01-hook" data-composition-src="compositions/01-hook.html" data-start="0" data-duration="3" data-track-index="1" data-width="1920" data-height="1080"></div>

      <!-- Scene 2 — The real order form (2.6 - 6.6, crossfades in over the last 0.4s of Scene 1) -->
      <div data-hf-id="hf-j0ku" id="slot-02" data-composition-id="02-order-form" data-composition-src="compositions/02-order-form.html" data-start="2.6" data-duration="4" data-track-index="2" data-width="1920" data-height="1080"></div>

      <!-- Scene 3 — The honest list (6.6 - 11.6, hard cut from Scene 2) -->
      <div data-hf-id="hf-qle5" id="slot-03" data-composition-id="03-pill-list" data-composition-src="compositions/03-pill-list.html" data-start="6.6" data-duration="5" data-track-index="1" data-width="1920" data-height="1080"></div>

      <!-- Scene 4 — The reassurance (11.2 - 15.2, crossfades in over the last 0.4s of Scene 3) -->
      <div data-hf-id="hf-egko" id="slot-04" data-composition-id="04-info-note" data-composition-src="compositions/04-info-note.html" data-start="11.2" data-duration="4" data-track-index="2" data-width="1920" data-height="1080"></div>

      <!-- Scene 5 — Outro (14.8 - 17.8, crossfades in over the last 0.4s of Scene 4) -->
      <div data-hf-id="hf-apds" id="slot-05" data-composition-id="05-outro" data-composition-src="compositions/05-outro.html" data-start="14.8" data-duration="3" data-track-index="1" data-width="1920" data-height="1080"></div>

      <!-- Music bed — continuous at root, survives every scene cut. Warm/restrained:
           fades in under Scene 1, holds low, fades to silence under the Scene 5 card. -->
      <audio data-hf-id="hf-rnx6" id="bgm" class="clip" src="assets/music/happy-beats-business-moves-vol-10-by-ende-dot-app.mp3" data-start="0" data-duration="17.8" data-track-index="10" data-volume="0.32" data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0},{&quot;t&quot;:1.0,&quot;v&quot;:0.32},{&quot;t&quot;:14.8,&quot;v&quot;:0.32},{&quot;t&quot;:17.8,&quot;v&quot;:0}]}]}"></audio>

      <!-- SFX — sparse, warm, tied to the real interactions in Scenes 2-4.
           Toggle tap: beat-locked to 4.10s (exact beat in the vol-10 grid). -->
      <audio data-hf-id="hf-zkdo" id="sfx-toggle-tap" class="clip" src="assets/sfx-interface/switch_007.ogg" data-start="4.10" data-duration="0.614" data-track-index="11" data-volume="0.5"></audio>

      <!-- Pill pops — natural readable spacing (1.0s apart), not beat-snapped: these are
           full multi-word product names, and snapping 4 text reveals to the beat grid
           here (nearest beats land 0.15-0.3s off) would rush them past the reading floor. -->
      <audio data-hf-id="hf-nhuz" id="sfx-pill-1" class="clip" src="assets/sfx-interface/click_003.ogg" data-start="7.2" data-duration="0.03" data-track-index="12" data-volume="0.4"></audio>
      <audio data-hf-id="hf-ce52" id="sfx-pill-2" class="clip" src="assets/sfx-interface/click_002.ogg" data-start="8.2" data-duration="0.03" data-track-index="12" data-volume="0.4"></audio>
      <audio data-hf-id="hf-md79" id="sfx-pill-3" class="clip" src="assets/sfx-interface/click_005.ogg" data-start="9.2" data-duration="0.03" data-track-index="12" data-volume="0.4"></audio>
      <audio data-hf-id="hf-dw4o" id="sfx-pill-4" class="clip" src="assets/sfx-interface/click_003.ogg" data-start="10.2" data-duration="0.03" data-track-index="12" data-volume="0.4"></audio>

      <!-- Info-icon tap: beat-locked to 12.02s (within 0.08s). -->
      <audio data-hf-id="hf-ncgf" id="sfx-info-tap" class="clip" src="assets/sfx-interface/click_005.ogg" data-start="12.10" data-duration="0.03" data-track-index="13" data-volume="0.45"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      // Root timeline is intentionally near-empty — all animation lives in the sub-comps.
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
