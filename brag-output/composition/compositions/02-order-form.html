<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Fraunces";
          font-style: normal;
          font-weight: 100 900;
          font-display: block;
          src: url("assets/fonts/fraunces-latin.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
            U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
            U+FEFF, U+FFFD;
        }
        @font-face {
          font-family: "Work Sans";
          font-style: normal;
          font-weight: 100 900;
          font-display: block;
          src: url("assets/fonts/worksans-latin.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
            U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
            U+FEFF, U+FFFD;
        }

        #root-02 {
          position: absolute;
          inset: 0;
          background: #fbf3e7;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: "Work Sans", sans-serif;
          opacity: 0; /* crossfades in from Scene 1 */
        }
        .card {
          width: 1180px;
          background: #fffefb;
          border-radius: 32px;
          padding: 64px 68px;
          box-shadow: 0 1px 2px rgba(54, 38, 23, 0.06), 0 24px 60px -20px rgba(54, 38, 23, 0.22);
        }
        .card h3 {
          font-family: "Fraunces", serif;
          font-weight: 600;
          font-size: 42px;
          color: #362617;
          margin-bottom: 32px;
        }
        .item-row {
          display: flex;
          align-items: center;
          gap: 18px;
          padding: 14px;
          background: #f5ebda;
          border: 1px solid #e6d5be;
          border-radius: 18px;
        }
        .item-pill {
          flex: 1;
          background: #fffefb;
          border: 1px solid #e6d5be;
          border-radius: 14px;
          padding: 20px 26px;
          font-size: 28px;
          color: #362617;
        }
        .qty-box {
          width: 74px;
          height: 74px;
          background: #fffefb;
          border: 1px solid #e6d5be;
          border-radius: 14px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 28px;
          color: #362617;
          font-weight: 500;
        }
        .remove-x {
          width: 60px;
          height: 60px;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #b3452c;
          font-size: 26px;
        }
        .add-btn {
          margin-top: 32px;
          display: inline-flex;
          align-items: center;
          gap: 12px;
          background: #c4703b;
          color: #fffefb;
          border-radius: 16px;
          padding: 22px 34px;
          font-size: 28px;
          font-weight: 500;
        }
        .add-btn .plus {
          font-size: 30px;
          line-height: 1;
        }
        .toggle-link {
          display: inline-block;
          margin-top: 30px;
          font-size: 27px;
          font-weight: 500;
          color: rgba(54, 38, 23, 0.7);
          text-decoration: underline;
          text-decoration-style: dotted;
          text-underline-offset: 4px;
        }

        /* Cursor + click feedback */
        .cursor {
          position: absolute;
          top: 0;
          left: 0;
          width: 44px;
          height: 44px;
          pointer-events: none;
          z-index: 20;
          filter: drop-shadow(0 2px 4px rgba(54, 38, 23, 0.35));
        }
        .ripple {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 90px;
          height: 90px;
          border-radius: 50%;
          border: 2px solid #c4703b;
          transform: translate(-50%, -50%) scale(0);
          opacity: 0;
          pointer-events: none;
          z-index: 19;
        }
      </style>

      <div id="root-02" data-composition-id="02-order-form" data-width="1920" data-height="1080" data-duration="4">
        <div data-hf-id="hf-4zky" class="card" id="card">
          <h3 data-hf-id="hf-sezz">Ordered products</h3>
          <div data-hf-id="hf-0sqm" class="item-row">
            <div data-hf-id="hf-yz4y" class="item-pill">Beli hleb - Fehér kenyér - 500g (200 RSD)</div>
            <div data-hf-id="hf-eh5z" class="qty-box">1</div>
            <div data-hf-id="hf-6jpf" class="remove-x">✖</div>
          </div>
          <div data-hf-id="hf-thvm" class="add-btn"><span data-hf-id="hf-955y" class="plus">+</span> Add product</div>
          <br data-hf-id="hf-x5px">
          <span data-hf-id="hf-hgt4" class="toggle-link" id="toggle-link">Don’t see what you’re looking for?</span>
        </div>

        <!-- ripple lives in DOM from t=0, centered on the toggle link at build time -->
        <div data-hf-id="hf-qesw" class="ripple" id="ripple-1"></div>
        <div data-hf-id="hf-z2or" class="ripple" id="ripple-2"></div>

        <div data-hf-id="hf-c0g2" class="cursor" id="cursor">
          <svg data-hf-id="hf-dshe" width="44" height="44" viewBox="0 0 24 24" fill="none">
            <path data-hf-id="hf-fi7r" d="M4 2L4 20L9 15.5L12.5 22L15.5 20.5L12 14L19 14L4 2Z" fill="#c4703b" stroke="#fffefb" stroke-width="1.5" stroke-linejoin="round" />
          </svg>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Unique id (not the generic "root" every scene used to share) — avoids any
        // ambiguity with the host's own slot div, which carries the same
        // data-composition-id attribute by design.
        const rootEl = document.getElementById("root-02");
        const toggleEl = rootEl.querySelector("#toggle-link");
        const rootRect = rootEl.getBoundingClientRect();
        const toggleRect = toggleEl.getBoundingClientRect();
        const targetX = toggleRect.left - rootRect.left + toggleRect.width / 2;
        const targetY = toggleRect.top - rootRect.top + toggleRect.height / 2;

        // position the two ripple rings at the toggle's center; cursor starts off to the
        // lower-right, outside the card
        gsap.set(["#ripple-1", "#ripple-2"], { x: targetX, y: targetY });
        gsap.set("#cursor", { x: 1520, y: 760 });

        // crossfade in from Scene 1 (host clips overlap by 0.4s)
        tl.fromTo(rootEl, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.inOut" }, 0);

        // cursor-click-ripple: move -> click -> ripple
        const MOVE_AT = 0.6;
        const MOVE_DUR = 0.75;
        const CLICK_AT = 1.5; // beat-locked: 4.10s host time (exact beat in the vol-10 grid)
        const PRESS_DUR = 0.08;
        const RIPPLE_AT = CLICK_AT + 0.05;
        const RIPPLE_DUR = 0.6;

        tl.to("#cursor", { x: targetX - 6, y: targetY - 4, duration: MOVE_DUR, ease: "power3.out" }, MOVE_AT);

        tl.to(
          "#cursor",
          { scale: 0.85, duration: PRESS_DUR, ease: "power2.in", yoyo: true, repeat: 1 },
          CLICK_AT,
        );
        tl.to(
          "#toggle-link",
          { scale: 0.96, duration: PRESS_DUR, ease: "power2.in", yoyo: true, repeat: 1 },
          CLICK_AT,
        );

        tl.set(["#ripple-1", "#ripple-2"], { opacity: 1 }, RIPPLE_AT);
        tl.to(
          ["#ripple-1", "#ripple-2"],
          {
            scale: 4,
            opacity: 0,
            duration: RIPPLE_DUR,
            ease: "power2.out",
            stagger: 0.09,
            immediateRender: false,
          },
          RIPPLE_AT,
        );

        // Holds on the tapped toggle for the rest of the scene — the cut to Scene 3
        // reveals what the tap opened.

        window.__timelines["02-order-form"] = tl;
      </script>
    </template>
  </body>
</html>
