<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Fraunces";
          font-style: normal;
          font-weight: 100 900;
          font-display: block;
          src: url("assets/fonts/fraunces-latin.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
            U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
            U+FEFF, U+FFFD;
        }
        @font-face {
          font-family: "Work Sans";
          font-style: normal;
          font-weight: 100 900;
          font-display: block;
          src: url("assets/fonts/worksans-latin.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
            U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
            U+FEFF, U+FFFD;
        }

        #root-04 {
          position: absolute;
          inset: 0;
          background: #fbf3e7;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: "Work Sans", sans-serif;
          opacity: 0; /* crossfades in from Scene 3 — identical content underneath */
        }
        .card {
          width: 1180px;
          background: #fffefb;
          border-radius: 32px;
          padding: 64px 68px;
          box-shadow: 0 1px 2px rgba(54, 38, 23, 0.06), 0 24px 60px -20px rgba(54, 38, 23, 0.22);
        }
        .card h3 {
          font-family: "Fraunces", serif;
          font-weight: 600;
          font-size: 42px;
          color: #362617;
          margin-bottom: 32px;
        }
        .item-row {
          display: flex;
          align-items: center;
          gap: 18px;
          padding: 14px;
          background: #f5ebda;
          border: 1px solid #e6d5be;
          border-radius: 18px;
        }
        .item-pill {
          flex: 1;
          background: #fffefb;
          border: 1px solid #e6d5be;
          border-radius: 14px;
          padding: 20px 26px;
          font-size: 28px;
          color: #362617;
        }
        .qty-box {
          width: 74px;
          height: 74px;
          background: #fffefb;
          border: 1px solid #e6d5be;
          border-radius: 14px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 28px;
          color: #362617;
          font-weight: 500;
        }
        .remove-x {
          width: 60px;
          height: 60px;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #b3452c;
          font-size: 26px;
        }
        .add-btn {
          margin-top: 32px;
          display: inline-flex;
          align-items: center;
          gap: 12px;
          background: #c4703b;
          color: #fffefb;
          border-radius: 16px;
          padding: 22px 34px;
          font-size: 28px;
          font-weight: 500;
        }
        .add-btn .plus {
          font-size: 30px;
          line-height: 1;
        }
        .toggle-link {
          display: inline-block;
          margin-top: 30px;
          font-size: 27px;
          font-weight: 500;
          color: rgba(54, 38, 23, 0.7);
          text-decoration: underline;
          text-decoration-style: dotted;
          text-underline-offset: 4px;
        }

        .disclosure {
          position: relative;
          margin-top: 22px;
          border: 1px solid #e6d5be;
          background: #f5ebda;
          border-radius: 16px;
          padding: 26px 28px;
        }
        .disclosure-intro {
          display: flex;
          align-items: center;
          gap: 10px;
          font-size: 25px;
          color: rgba(54, 38, 23, 0.7);
        }
        .info-icon {
          flex-shrink: 0;
          width: 30px;
          height: 30px;
          border-radius: 50%;
          border: 1.5px solid rgba(54, 38, 23, 0.4);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 17px;
          font-weight: 600;
          color: #5a4a3a;
        }
        .note-mask {
          overflow: hidden;
        }
        .note-sheet {
          padding-top: 16px;
          font-size: 22px;
          line-height: 1.5;
          color: #776959;
          max-width: 960px;
        }
        .note-sheet a {
          color: #9d5a2f;
          font-weight: 600;
          text-decoration: underline;
        }
        .pill-cloud {
          margin-top: 20px;
          display: flex;
          flex-wrap: wrap;
          gap: 12px;
        }
        .pill {
          border: 1px solid #e6d5be;
          background: rgba(255, 254, 251, 0.6);
          border-radius: 999px;
          padding: 12px 22px;
          font-size: 23px;
          color: #5a4a3a;
        }

        .cursor {
          position: absolute;
          top: 0;
          left: 0;
          width: 44px;
          height: 44px;
          pointer-events: none;
          z-index: 20;
          filter: drop-shadow(0 2px 4px rgba(54, 38, 23, 0.35));
        }
        .ripple {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 60px;
          height: 60px;
          border-radius: 50%;
          border: 2px solid #c4703b;
          transform: translate(-50%, -50%) scale(0);
          opacity: 0;
          pointer-events: none;
          z-index: 19;
        }
      </style>

      <div id="root-04" data-composition-id="04-info-note" data-width="1920" data-height="1080" data-duration="4">
        <div data-hf-id="hf-4zky" class="card" id="card">
          <h3 data-hf-id="hf-sezz">Ordered products</h3>
          <div data-hf-id="hf-0sqm" class="item-row">
            <div data-hf-id="hf-yz4y" class="item-pill">Beli hleb - Fehér kenyér - 500g (200 RSD)</div>
            <div data-hf-id="hf-eh5z" class="qty-box">1</div>
            <div data-hf-id="hf-6jpf" class="remove-x">✖</div>
          </div>
          <div data-hf-id="hf-thvm" class="add-btn"><span data-hf-id="hf-955y" class="plus">+</span> Add product</div>
          <br data-hf-id="hf-x5px">
          <span data-hf-id="hf-ug88" class="toggle-link">Hide unavailable products</span>

          <div data-hf-id="hf-rsgq" class="disclosure" id="disclosure">
            <div data-hf-id="hf-f14i" class="disclosure-intro">
              <span data-hf-id="hf-9yv6">These products aren’t available right now:</span>
              <span data-hf-id="hf-gmfi" class="info-icon" id="info-icon">i</span>
            </div>

            <div class="note-mask" id="note-mask" data-layout-allow-overflow>
              <div class="note-sheet" id="note-sheet" data-layout-allow-overlap>
                These may become available again. Want to know when, or looking for something
                similar? <a data-hf-id="hf-m0w0">Email us</a>.
              </div>
            </div>

            <div data-hf-id="hf-qsq4" id="below">
              <div data-hf-id="hf-c7yd" class="pill-cloud">
                <div data-hf-id="hf-t9ed" class="pill">Tigrasti hleb - Tigris kenyér - 1000g</div>
                <div data-hf-id="hf-cpxi" class="pill">Pan Cubano - 800g</div>
                <div data-hf-id="hf-vnc9" class="pill">Hleb sa heljdom - Hajdinás kenyét - 1000g</div>
                <div data-hf-id="hf-26nn" class="pill">Polubeli hleb - Félfehér kenyér - 1000g</div>
              </div>
            </div>
          </div>
        </div>

        <div data-hf-id="hf-qesw" class="ripple" id="ripple-1"></div>
        <div data-hf-id="hf-z2or" class="ripple" id="ripple-2"></div>

        <div data-hf-id="hf-c0g2" class="cursor" id="cursor">
          <svg data-hf-id="hf-dshe" width="44" height="44" viewBox="0 0 24 24" fill="none">
            <path data-hf-id="hf-fi7r" d="M4 2L4 20L9 15.5L12.5 22L15.5 20.5L12 14L19 14L4 2Z" fill="#c4703b" stroke="#fffefb" stroke-width="1.5" stroke-linejoin="round" />
          </svg>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Unique id (not the generic "root" every scene used to share) — avoids any
        // ambiguity with the host's own slot div, which carries the same
        // data-composition-id attribute by design.
        const rootEl = document.getElementById("root-04");
        const iconEl = rootEl.querySelector("#info-icon");
        const noteMask = rootEl.querySelector("#note-mask");
        const noteSheet = rootEl.querySelector("#note-sheet");
        const below = rootEl.querySelector("#below");

        // Measure the note's natural height BEFORE collapsing it (anchored-layout-expand:
        // author the expanded state in CSS, then fake the collapsed state with transforms).
        const BODY_H = noteSheet.offsetHeight;
        noteMask.style.height = BODY_H + "px";

        const rootRect = rootEl.getBoundingClientRect();
        const iconRect = iconEl.getBoundingClientRect();
        const targetX = iconRect.left - rootRect.left + iconRect.width / 2;
        const targetY = iconRect.top - rootRect.top + iconRect.height / 2;

        gsap.set(["#ripple-1", "#ripple-2"], { x: targetX, y: targetY });
        gsap.set("#cursor", { x: 1520, y: 300 });
        // Note starts tucked above the mask; "below" (the pill cloud) starts pre-shifted
        // up by the same amount, so the two travel down together and the pills only
        // settle into their final spot exactly as the note finishes opening.
        gsap.set([noteSheet, below], { y: -BODY_H });

        // crossfade in from Scene 3 — content is otherwise identical, so this reads as a
        // continuation, not a cut
        tl.fromTo(rootEl, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.inOut" }, 0);

        // cursor-click-ripple on the "i" icon
        const MOVE_AT = 0.4;
        const MOVE_DUR = 0.4;
        const CLICK_AT = 0.9; // beat-locked: 12.10s host time (within 0.08s of the 12.02s beat)
        const PRESS_DUR = 0.07;
        const RIPPLE_AT = CLICK_AT + 0.04;

        tl.to("#cursor", { x: targetX - 4, y: targetY - 2, duration: MOVE_DUR, ease: "power3.out" }, MOVE_AT);

        tl.to(
          "#cursor",
          { scale: 0.85, duration: PRESS_DUR, ease: "power2.in", yoyo: true, repeat: 1 },
          CLICK_AT,
        );
        tl.to(
          "#info-icon",
          { scale: 0.88, duration: PRESS_DUR, ease: "power2.in", yoyo: true, repeat: 1 },
          CLICK_AT,
        );

        tl.set(["#ripple-1", "#ripple-2"], { opacity: 1 }, RIPPLE_AT);
        tl.to(
          ["#ripple-1", "#ripple-2"],
          { scale: 3.4, opacity: 0, duration: 0.5, ease: "power2.out", stagger: 0.08, immediateRender: false },
          RIPPLE_AT,
        );

        // anchored-layout-expand: the note unfurls and the pill cloud rides down with it,
        // in perfect contact — ONE shared tween drives both.
        const GROW_AT = 1.0;
        tl.fromTo(
          [noteSheet, below],
          { y: -BODY_H },
          { y: 0, duration: 0.5, ease: "power3.out" },
          GROW_AT,
        );

        // Holds the reassurance note for the rest of the scene.

        window.__timelines["04-info-note"] = tl;
      </script>
    </template>
  </body>
</html>
