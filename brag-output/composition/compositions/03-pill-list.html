      <style>

          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
            U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
            U+FEFF, U+FFFD;
        }
        @font-face {
          font-family: "Work Sans";

          font-weight: 100 900;
          font-display: block;
          src: url("assets/fonts/worksans-latin.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
            U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
            U+FEFF, U+FFFD;

        #root {
          position: absolute;
          inset: 0;
          background: #fbf3e7;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: "Work Sans", sans-serif;
        }
        .card {
          width: 1180px;
          background: #fffefb;
          border-radius: 32px;
          padding: 64px 68px;
          box-shadow: 0 1px 2px rgba(54, 38, 23, 0.06), 0 24px 60px -20px rgba(54, 38, 23, 0.22);
        }
        .card h3 {
          font-family: "Fraunces", serif;
          font-weight: 600;
          font-size: 42px;
          color: #362617;
          margin-bottom: 32px;
        }
        .item-row {
          display: flex;
          align-items: center;
          gap: 18px;
          padding: 14px;
          background: #f5ebda;
          border: 1px solid #e6d5be;
          border-radius: 18px;
        }
        .item-pill {
          flex: 1;
          background: #fffefb;
          border: 1px solid #e6d5be;
          border-radius: 14px;
          padding: 20px 26px;
          font-size: 28px;
          color: #362617;
        }
        .qty-box {
          width: 74px;
          height: 74px;
          background: #fffefb;
          border: 1px solid #e6d5be;
          border-radius: 14px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 28px;
          color: #362617;
          font-weight: 500;
        }
        .remove-x {
          width: 60px;
          height: 60px;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #b3452c;
          font-size: 26px;
        }
        .add-btn {
          margin-top: 32px;
          display: inline-flex;
          align-items: center;
          gap: 12px;
          background: #c4703b;
          color: #fffefb;
          border-radius: 16px;
          padding: 22px 34px;
          font-size: 28px;
          font-weight: 500;
        }
        .add-btn .plus {
          font-size: 30px;
          line-height: 1;
        }
        .toggle-link {
          display: inline-block;
          margin-top: 30px;
          font-size: 27px;
          font-weight: 500;
          color: rgba(54, 38, 23, 0.7);
          text-decoration: underline;
          text-decoration-style: dotted;
          text-underline-offset: 4px;
        }

        .disclosure {
          margin-top: 22px;
          border: 1px solid #e6d5be;
          background: #f5ebda;
          border-radius: 16px;
          padding: 26px 28px;
          opacity: 0;
        }
        .disclosure-intro {
          display: flex;
          align-items: center;
          gap: 10px;
          font-size: 25px;
          color: rgba(54, 38, 23, 0.7);
        }
        .info-icon {
          flex-shrink: 0;
          width: 30px;
          height: 30px;
          border-radius: 50%;
          border: 1.5px solid rgba(54, 38, 23, 0.4);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 17px;
          font-weight: 600;
          color: #5a4a3a;
        }
        .pill-cloud {
          margin-top: 20px;
          display: flex;
          flex-wrap: wrap;
          gap: 12px;
        }
        .pill {
          border: 1px solid #e6d5be;
          background: rgba(255, 254, 251, 0.6);
          border-radius: 999px;
          padding: 12px 22px;
          font-size: 23px;
          color: #5a4a3a;
          opacity: 0;
          transform: scale(0);
          transform-origin: 50% 50%;
        }
      </style>

      <div data-hf-id="hf-mey0" id="root" data-composition-id="03-pill-list" data-width="1920" data-height="1080" data-duration="5">
        <div data-hf-id="hf-4zky" class="card" id="card">
          <h3 data-hf-id="hf-sezz">Ordered products</h3>
          <div data-hf-id="hf-0sqm" class="item-row">
            <div data-hf-id="hf-yz4y" class="item-pill">Beli hleb - Fehér kenyér - 500g (200 RSD)</div>
            <div data-hf-id="hf-eh5z" class="qty-box">1</div>
            <div data-hf-id="hf-6jpf" class="remove-x">✖</div>
          </div>
          <div data-hf-id="hf-thvm" class="add-btn"><span data-hf-id="hf-955y" class="plus">+</span> Add product</div>
          <br data-hf-id="hf-x5px">
          <span data-hf-id="hf-ug88" class="toggle-link">Hide unavailable products</span>

          <div data-hf-id="hf-rsgq" class="disclosure" id="disclosure">
            <div data-hf-id="hf-f14i" class="disclosure-intro">
              <span data-hf-id="hf-9yv6">These products aren’t available right now:</span>
              <span data-hf-id="hf-eubg" class="info-icon">i</span>
            </div>
            <div data-hf-id="hf-c7yd" class="pill-cloud">
              <div data-hf-id="hf-qkoy" class="pill" id="pill-1">Tigrasti hleb - Tigris kenyér - 1000g</div>
              <div data-hf-id="hf-bybg" class="pill" id="pill-2">Pan Cubano - 800g</div>
              <div data-hf-id="hf-rso8" class="pill" id="pill-3">Hleb sa heljdom - Hajdinás kenyét - 1000g</div>
              <div data-hf-id="hf-14jb" class="pill" id="pill-4">Polubeli hleb - Félfehér kenyér - 1000g</div>
            </div>
          </div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Disclosure box: low-drama fade + short rise (grid-card-assemble vocabulary).
        tl.fromTo(
          "#disclosure",
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
          0,
        );

        // Pills self-assemble one by one — spring-pop-entrance, smooth settle (no
        // overshoot). Natural 1.0s spacing chosen for reading time: these are full
        // multi-word product names, not short stats, so beat-snapping every arrival
        // would outrun the reading floor. Not beat-locked.
        const pillTimes = [0.6, 1.6, 2.6, 3.6];
        ["#pill-1", "#pill-2", "#pill-3", "#pill-4"].forEach((sel, i) => {
          tl.fromTo(
            sel,
            { scale: 0, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.36, ease: "power3.out" },
            pillTimes[i],
          );
        });

        // Holds the completed pill-cloud for the rest of the scene.

        window.__timelines["03-pill-list"] = tl;
      </script>
    </template>
  </body>
</html>
