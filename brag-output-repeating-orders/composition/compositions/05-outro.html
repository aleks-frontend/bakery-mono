  <body>
    <template>
      <style>
        @font-face {
          font-family: "Fraunces";
          font-style: normal;

          src: url("assets/fonts/fraunces-latin.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,

            U+FEFF, U+FFFD;
        }
        @font-face {
          font-family: "Work Sans";
          font-style: normal;
          font-weight: 100 900;
          font-display: block;
          src: url("assets/fonts/worksans-latin.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
            U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
            U+FEFF, U+FFFD;
        }
        @font-face {
          font-family: "Work Sans";
          font-style: normal;
          font-weight: 100 900;
          font-display: block;
          src: url("assets/fonts/worksans-latin-ext.woff2") format("woff2");
          unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
            U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB,
            U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }

        #root-05 {
          position: absolute;
          inset: 0;
          background: #fbf3e7;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: "Work Sans", sans-serif;
          opacity: 0; /* crossfades in from Scene 4 */
        }
        .lockup {
          display: flex;
          flex-direction: column;
          align-items: center;
          max-width: 900px;
          padding: 0 40px;
        }
        .logo {
          width: 130px;
          height: 130px;
          object-fit: contain;
          filter: drop-shadow(0 6px 14px rgba(196, 112, 59, 0.3));
        }
        .wordmark {
          margin-top: 26px;
          font-family: "Fraunces", serif;
          font-weight: 600;
          font-size: 56px;
          letter-spacing: 0.02em;
          text-transform: uppercase;
          color: #362617;
        }
        .thankyou {
          margin-top: 22px;
          text-align: center;
          font-size: 27px;
          line-height: 1.5;
          color: #776959;
          opacity: 0;
        }
      </style>

      <div id="root-05" data-composition-id="05-outro" data-width="1920" data-height="1080" data-duration="3.5">
        <div class="lockup" id="lockup">
          <img class="logo" src="assets/logo.png" alt="" />
          <div class="wordmark">Liszt: Rapsz&oacute;dia</div>
          <div class="thankyou" id="thankyou">
            Hvala vam &scaron;to nas pu&scaron;tate u va&scaron; dom, svake nedelje.
          </div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const rootEl = document.getElementById("root-05");

        // crossfade in from Scene 4
        tl.fromTo(rootEl, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.inOut" }, 0);

        // titlecard-reveal: one restrained move (calm settle, no overshoot), then hold.
        tl.fromTo("#lockup", { scale: 0.95, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
        tl.fromTo("#thankyou", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.75);

        // Holds to the end — the calm close.

        window.__timelines["05-outro"] = tl;
      </script>
    </template>
  </body>
