<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Fraunces";
          font-style: normal;
          font-weight: 100 900;
          font-display: block;
          src: url("assets/fonts/fraunces-latin.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
            U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
            U+FEFF, U+FFFD;
        }
        @font-face {
          font-family: "Work Sans";
          font-style: normal;
          font-weight: 100 900;
          font-display: block;
          src: url("assets/fonts/worksans-latin.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
            U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
            U+FEFF, U+FFFD;
        }
        @font-face {
          font-family: "Work Sans";
          font-style: normal;
          font-weight: 100 900;
          font-display: block;
          src: url("assets/fonts/worksans-latin-ext.woff2") format("woff2");
          unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
            U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB,
            U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }

        #root-02 {
          position: absolute;
          inset: 0;
          background: #fbf3e7;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: "Work Sans", sans-serif;
          opacity: 0; /* crossfades in from Scene 1 */
        }
        .card {
          width: 1080px;
          background: #fffefb;
          border-radius: 32px;
          padding: 56px 64px 60px;
          box-shadow: 0 1px 2px rgba(54, 38, 23, 0.06), 0 24px 60px -20px rgba(54, 38, 23, 0.22);
        }
        /* Context above the checkbox — the rest of the real order form, muted so the
           eye still lands on the checkbox, but present so customers can see exactly
           where in the form this option lives (bottom, after items + total). */
        .context {
          opacity: 0.55;
        }
        .products-heading {
          margin: 0 0 18px;
          font-family: "Fraunces", serif;
          font-weight: 600;
          font-size: 26px;
          color: #362617;
        }
        .item-row-mini {
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 10px;
          background: #f5ebda;
          border: 1px solid #e6d5be;
          border-radius: 14px;
        }
        .item-pill-mini {
          flex: 1;
          background: #fffefb;
          border: 1px solid #e6d5be;
          border-radius: 10px;
          padding: 14px 18px;
          font-size: 20px;
          color: #362617;
        }
        .qty-box-mini {
          width: 48px;
          height: 48px;
          background: #fffefb;
          border: 1px solid #e6d5be;
          border-radius: 10px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 20px;
          color: #362617;
        }
        .total-row {
          margin-top: 22px;
          padding-top: 22px;
          border-top: 1px solid #e6d5be;
          display: flex;
          align-items: baseline;
          justify-content: flex-end;
          gap: 10px;
        }
        .total-row .label {
          font-size: 19px;
          color: #776959;
        }
        .total-row .value {
          font-family: "Fraunces", serif;
          font-weight: 600;
          font-size: 30px;
          color: #362617;
        }
        .total-row .unit {
          font-size: 18px;
          color: #776959;
        }
        .divider {
          margin: 30px 0;
          border: none;
          border-top: 1px solid #e6d5be;
        }
        .repeat-row {
          display: flex;
          align-items: flex-start;
          gap: 20px;
        }
        .checkbox {
          flex-shrink: 0;
          width: 34px;
          height: 34px;
          margin-top: 3px;
          border-radius: 9px;
          border: 2px solid #e6d5be;
          background: #fffefb;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .checkbox svg {
          width: 20px;
          height: 20px;
        }
        .checkbox path {
          fill: none;
          stroke: #fffefb;
          stroke-width: 3;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .repeat-copy .title {
          display: block;
          font-size: 30px;
          font-weight: 600;
          color: #362617;
        }
        .repeat-copy .sub {
          display: block;
          margin-top: 8px;
          font-size: 21px;
          line-height: 1.5;
          color: #776959;
        }
        .submit-btn {
          margin-top: 40px;
          display: inline-block;
          background: #c4703b;
          color: #fffefb;
          border-radius: 16px;
          padding: 22px 40px;
          font-size: 28px;
          font-weight: 500;
        }

        .cursor {
          position: absolute;
          top: 0;
          left: 0;
          width: 44px;
          height: 44px;
          pointer-events: none;
          z-index: 20;
          filter: drop-shadow(0 2px 4px rgba(54, 38, 23, 0.35));
        }
        .ripple {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 70px;
          height: 70px;
          border-radius: 50%;
          border: 2px solid #c4703b;
          transform: translate(-50%, -50%) scale(0);
          opacity: 0;
          pointer-events: none;
          z-index: 19;
        }
      </style>

      <div id="root-02" data-composition-id="02-checkbox" data-width="1920" data-height="1080" data-duration="5">
        <div class="card">
          <div class="context">
            <h3 class="products-heading">Naru&#269;eni proizvodi</h3>
            <div class="item-row-mini">
              <div class="item-pill-mini">Beli hleb - Feh&eacute;r keny&eacute;r - 500g (200 RSD)</div>
              <div class="qty-box-mini">1</div>
            </div>
            <div class="total-row">
              <span class="label">Ukupna cena:</span>
              <span class="value">200</span>
              <span class="unit">RSD</span>
            </div>
          </div>
          <hr class="divider" />
          <div class="repeat-row">
            <div class="checkbox" id="checkbox">
              <svg viewBox="0 0 20 20">
                <path id="check-path" d="M3 10.5 L8 15 L17 4" />
              </svg>
            </div>
            <span class="repeat-copy">
              <span class="title">Ponavljaj ovu porud&#382;binu svake nedelje</span>
              <span class="sub"
                >Dobija&#263;ete ovu istu porud&#382;binu automatski svake nedelje &mdash;
                ne&#263;ete morati ponovo da je &scaron;aljete, osim ako &#382;elite da je
                izmenite ili otka&#382;ete.</span
              >
            </span>
          </div>
          <div class="submit-btn" id="submit-btn">Po&scaron;alji narud&#382;binu</div>
        </div>

        <div class="ripple" id="ripple-check-1"></div>
        <div class="ripple" id="ripple-check-2"></div>
        <div class="ripple" id="ripple-submit-1"></div>
        <div class="ripple" id="ripple-submit-2"></div>

        <div class="cursor" id="cursor">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none">
            <path
              d="M4 2L4 20L9 15.5L12.5 22L15.5 20.5L12 14L19 14L4 2Z"
              fill="#c4703b"
              stroke="#fffefb"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Unique id — avoids the host slot / sub-comp root ambiguity documented in
        // brag-output/composition (video 1's crossfade bug).
        const rootEl = document.getElementById("root-02");
        const checkboxEl = rootEl.querySelector("#checkbox");
        const submitEl = rootEl.querySelector("#submit-btn");
        const checkPath = rootEl.querySelector("#check-path");

        const rootRect = rootEl.getBoundingClientRect();
        const checkboxRect = checkboxEl.getBoundingClientRect();
        const submitRect = submitEl.getBoundingClientRect();
        const checkboxX = checkboxRect.left - rootRect.left + checkboxRect.width / 2;
        const checkboxY = checkboxRect.top - rootRect.top + checkboxRect.height / 2;
        const submitX = submitRect.left - rootRect.left + submitRect.width / 2;
        const submitY = submitRect.top - rootRect.top + submitRect.height / 2;

        gsap.set(["#ripple-check-1", "#ripple-check-2"], { x: checkboxX, y: checkboxY });
        gsap.set(["#ripple-submit-1", "#ripple-submit-2"], { x: submitX, y: submitY });
        gsap.set("#cursor", { x: 1550, y: 200 });

        // Checkmark path drawn later, dash-offset prepared now.
        const pathLen = checkPath.getTotalLength();
        gsap.set(checkPath, { strokeDasharray: pathLen, strokeDashoffset: pathLen });

        // crossfade in from Scene 1
        tl.fromTo(rootEl, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.inOut" }, 0);

        // --- cursor-click-ripple #1: check the box ---
        const MOVE1_AT = 0.5;
        const MOVE1_DUR = 0.75;
        const CLICK1_AT = 1.5; // beat-locked: 4.10s host time (exact beat in the vol-10 grid)
        const PRESS_DUR = 0.08;

        tl.to(
          "#cursor",
          { x: checkboxX - 4, y: checkboxY - 2, duration: MOVE1_DUR, ease: "power3.out" },
          MOVE1_AT,
        );
        tl.to(
          "#cursor",
          { scale: 0.85, duration: PRESS_DUR, ease: "power2.in", yoyo: true, repeat: 1 },
          CLICK1_AT,
        );
        tl.to(
          "#checkbox",
          { scale: 0.92, duration: PRESS_DUR, ease: "power2.in", yoyo: true, repeat: 1 },
          CLICK1_AT,
        );
        tl.set(["#ripple-check-1", "#ripple-check-2"], { opacity: 1 }, CLICK1_AT + 0.04);
        tl.to(
          ["#ripple-check-1", "#ripple-check-2"],
          { scale: 3.2, opacity: 0, duration: 0.5, ease: "power2.out", stagger: 0.08, immediateRender: false },
          CLICK1_AT + 0.04,
        );

        // checkbox fills, checkmark draws on (svg-path-draw). backgroundColor is on the
        // determinism allowlist; the border simply gets covered by the fill.
        tl.to(
          "#checkbox",
          { backgroundColor: "#c4703b", duration: 0.2, ease: "power2.out" },
          CLICK1_AT + 0.06,
        );
        tl.to(checkPath, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, CLICK1_AT + 0.12);

        // --- cursor-click-ripple #2: submit ---
        const MOVE2_AT = 2.0;
        const MOVE2_DUR = 0.75;
        const CLICK2_AT = 3.14; // beat-locked: 5.74s host time

        tl.to(
          "#cursor",
          { x: submitX - 4, y: submitY - 2, duration: MOVE2_DUR, ease: "power3.out" },
          MOVE2_AT,
        );
        tl.to(
          "#cursor",
          { scale: 0.85, duration: PRESS_DUR, ease: "power2.in", yoyo: true, repeat: 1 },
          CLICK2_AT,
        );
        tl.to(
          "#submit-btn",
          { scale: 0.96, duration: PRESS_DUR, ease: "power2.in", yoyo: true, repeat: 1 },
          CLICK2_AT,
        );
        tl.set(["#ripple-submit-1", "#ripple-submit-2"], { opacity: 1 }, CLICK2_AT + 0.04);
        tl.to(
          ["#ripple-submit-1", "#ripple-submit-2"],
          { scale: 3.6, opacity: 0, duration: 0.55, ease: "power2.out", stagger: 0.08, immediateRender: false },
          CLICK2_AT + 0.04,
        );

        // Holds on the submitted state for the rest of the scene — the cut to Scene 3
        // reveals the confirmation.

        window.__timelines["02-checkbox"] = tl;
      </script>
    </template>
  </body>
</html>
