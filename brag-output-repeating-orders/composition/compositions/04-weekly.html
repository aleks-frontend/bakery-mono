<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Fraunces";
          font-style: normal;
          font-weight: 100 900;
          font-display: block;
          src: url("assets/fonts/fraunces-latin.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
            U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
            U+FEFF, U+FFFD;
        }
        @font-face {
          font-family: "Work Sans";
          font-style: normal;
          font-weight: 100 900;
          font-display: block;
          src: url("assets/fonts/worksans-latin.woff2") format("woff2");
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
            U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
            U+FEFF, U+FFFD;
        }

        #root-04 {
          position: absolute;
          inset: 0;
          background: #fbf3e7;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 48px;
          font-family: "Work Sans", sans-serif;
          opacity: 0; /* crossfades in from Scene 3 */
        }
        .weeks {
          display: flex;
          gap: 32px;
        }
        .week-card {
          width: 300px;
          background: #fffefb;
          border: 1px solid #e6d5be;
          border-radius: 24px;
          padding: 36px 24px;
          text-align: center;
          box-shadow: 0 1px 2px rgba(54, 38, 23, 0.06), 0 16px 36px -16px rgba(54, 38, 23, 0.2);
          transform: scale(0);
          opacity: 0;
          transform-origin: 50% 50%;
        }
        .week-badge {
          margin: 0 auto 18px;
          width: 56px;
          height: 56px;
          border-radius: 50%;
          background: #e9ede4;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .week-badge svg {
          width: 28px;
          height: 28px;
        }
        .week-badge path {
          fill: none;
          stroke: #7c8b6f;
          stroke-width: 3;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .week-label {
          font-size: 26px;
          font-weight: 600;
          color: #362617;
        }
        .relax-line {
          font-family: "Fraunces", serif;
          font-weight: 600;
          font-size: 44px;
          color: #362617;
          text-align: center;
          opacity: 0;
        }
      </style>

      <div id="root-04" data-composition-id="04-weekly" data-width="1920" data-height="1080" data-duration="4">
        <div class="weeks">
          <div class="week-card" id="week-1">
            <div class="week-badge"><svg viewBox="0 0 20 20"><path d="M3 10.5 L8 15 L17 4" /></svg></div>
            <div class="week-label">Nedelja 1</div>
          </div>
          <div class="week-card" id="week-2">
            <div class="week-badge"><svg viewBox="0 0 20 20"><path d="M3 10.5 L8 15 L17 4" /></svg></div>
            <div class="week-label">Nedelja 2</div>
          </div>
          <div class="week-card" id="week-3">
            <div class="week-badge"><svg viewBox="0 0 20 20"><path d="M3 10.5 L8 15 L17 4" /></svg></div>
            <div class="week-label">Nedelja 3</div>
          </div>
        </div>
        <div class="relax-line" id="relax-line">Naru&#269;ite jednom. I opustite se.</div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const rootEl = document.getElementById("root-04");

        // crossfade in from Scene 3
        tl.fromTo(rootEl, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.inOut" }, 0);

        // Three weekly markers self-assemble — smooth settle, no overshoot (calm tone).
        // Natural ~0.6s spacing (not strictly beat-locked): each card carries a short
        // label, and reads fine at this pace since earlier cards stay visible.
        tl.fromTo("#week-1", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.36, ease: "power3.out" }, 0.4);
        tl.fromTo("#week-2", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.36, ease: "power3.out" }, 1.0);
        tl.fromTo("#week-3", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.36, ease: "power3.out" }, 1.6);

        // Reassurance line settles beneath, held to the end of the scene.
        tl.fromTo(
          "#relax-line",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
          2.4,
        );

        window.__timelines["04-weekly"] = tl;
      </script>
    </template>
  </body>
</html>
